[project]
name = "scheduling-api"
version = "0.1.0"
description = "Web API for the scheduling engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.1",
    "python-multipart>=0.0.32",
    "scheduling-engine",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
scheduling-engine = { path = "../engine", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
