[project]
name = "scheduling-engine"
version = "0.1.0"
description = "Scheduling engine: league data model, rule checks and solver"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "ortools>=9.15.6755",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-openpyxl>=3.1.5.20260827",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: solves a realistic 40-team league (about a minute each)"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
